# OpenAPI Generation Profile Configuration
# This profile is used specifically for generating OpenAPI documentation

# Application Info
app.title=Smart Task Management API
app.version=1.0.0
app.description=A comprehensive task management system with user authentication and role-based access control

# Server Configuration
server.port=8080
server.url=http://localhost:8080

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# OpenAPI Info
springdoc.info.title=${app.title}
springdoc.info.version=${app.version}
springdoc.info.description=${app.description}

# Package scanning
springdoc.packages-to-scan=com.task.controller
springdoc.paths-to-match=/api/**

# Security Configuration
springdoc.swagger-ui.oauth.clientId=swagger-ui
springdoc.swagger-ui.oauth.realm=swagger-ui-realm
springdoc.swagger-ui.oauth.appName=Smart Task Management API

# Database Configuration (H2 in-memory for generation)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Disable security for OpenAPI generation
spring.security.enabled=false
management.security.enabled=false

# Logging
logging.level.com.task=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.io.swagger=DEBUG